name: Phase 11A one-shot review fix

on:
  push:
    branches:
      - phase-11a-historical-data-audit

permissions:
  contents: write

jobs:
  apply-review-fixes:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: phase-11a-historical-data-audit
          fetch-depth: 0

      - name: Apply review fixes
        run: python tools/_phase11a_apply_review_fixes.py

      - name: Commit fixed implementation and remove one-shot files
        shell: bash
        run: |
          rm tools/_phase11a_apply_review_fixes.py
          rm .github/workflows/phase11a-one-shot-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: align historical audit with canonical builder semantics"
          git push origin HEAD:phase-11a-historical-data-audit
