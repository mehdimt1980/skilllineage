name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Node ${{ matrix.node }} / Ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Package smoke test
        run: node tools/test-package.mjs
      - name: GitSkills SQLite preflight synthetic tests
        run: python -m unittest tools/test_check_gitskills_source.py
      - name: Index integrity synthetic tests
        run: node tools/test-index-integrity.mjs
      - name: Benchmark aggregate redaction and guard tests
        run: node tools/test-benchmark-summary.mjs
      - name: Index field inventory coverage audit
        run: node tools/test-index-field-inventory.mjs
      - name: Synthetic distribution integrity and cache tests
        run: node tools/test-distribution-prototype.mjs
      - name: Synthetic distribution scale profiling regression
        run: node tools/test-synthetic-distribution-profile.mjs
      - name: Synthetic compact manifest and completeness-aware session tests
        run: node tools/test-compact-manifest-session.mjs
      - name: Record reproducible synthetic profile (Node 22)
        if: matrix.node == 22
        run: node tools/profile-synthetic-distribution.mjs --samples 32 --extra-shards 256

  windows-compatibility:
    name: Node 24 / Windows
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Package smoke test
        run: node tools/test-package.mjs
      - name: GitSkills SQLite preflight synthetic tests
        run: python -m unittest tools/test_check_gitskills_source.py
      - name: Index integrity synthetic tests
        run: node tools/test-index-integrity.mjs
      - name: Benchmark aggregate redaction and guard tests
        run: node tools/test-benchmark-summary.mjs
      - name: Index field inventory coverage audit
        run: node tools/test-index-field-inventory.mjs
      - name: Synthetic distribution integrity and cache tests
        run: node tools/test-distribution-prototype.mjs
      - name: Synthetic distribution scale profiling regression
        run: node tools/test-synthetic-distribution-profile.mjs
      - name: Synthetic compact manifest and completeness-aware session tests
        run: node tools/test-compact-manifest-session.mjs
